name: Compiler l’APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, principal]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l’APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Clé de signature personnelle (facultatif)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/perso.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/perso.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KS_KEYPASS"
            } >> "$GITHUB_ENV"
            echo "Clé personnelle utilisée."
          else
            echo "Aucune clé personnelle : la clé du projet (android/app/agenda-etoile.jks) est utilisée."
          fi

      - name: Compiler (debug + release)
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Renommer les APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/AgendaEtoile-2.1.9-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/AgendaEtoile-2.1.9-debug.apk"

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaEtoile-APK
          path: apk/*.apk
          if-no-files-found: error
